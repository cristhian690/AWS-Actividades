<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subir archivo a S3</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #f3f4f6; color: #1f2937; }
      main { width: min(420px, calc(100% - 40px)); padding: 32px; border-radius: 12px; background: white; box-shadow: 0 8px 24px #0000001a; }
      h1 { margin-top: 0; font-size: 24px; }
      form { display: grid; gap: 16px; }
      input, button { font: inherit; }
      button { padding: 12px; border: 0; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: wait; }
      #estado { min-height: 24px; margin: 16px 0 0; padding: 10px 12px; border-radius: 7px; }
      #estado:empty { padding: 0; }
      .exito { color: #166534; background: #dcfce7; }
      .error { color: #991b1b; background: #fee2e2; }
    </style>
  </head>
  <body>
    <main>
      <h1>Subir archivo a S3</h1>
      <p>Selecciona un archivo para guardarlo.</p>
      <form id="formulario">
        <input id="archivo" name="archivo" type="file" required />
        <button id="boton" type="submit">Subir archivo</button>
      </form>
      <p id="estado" role="status" aria-live="polite"></p>
    </main>

    <script>
      const formulario = document.querySelector("#formulario");
      const archivo = document.querySelector("#archivo");
      const boton = document.querySelector("#boton");
      const estado = document.querySelector("#estado");

      formulario.addEventListener("submit", async (evento) => {
        evento.preventDefault();
        if (!archivo.files.length) {
          mostrarEstado("Selecciona un archivo.", "error");
          return;
        }

        const datos = new FormData();
        const archivoSeleccionado = archivo.files[0];
        datos.append("archivo", archivoSeleccionado);
        boton.disabled = true;
        mostrarEstado("Subiendo archivo...", "");

        try {
          const respuesta = await fetch("/upload", { method: "POST", body: datos });
          const resultado = await leerJson(respuesta);
          if (!respuesta.ok) throw new Error(resultado.mensaje);

          mostrarEstado(resultado.mensaje, "exito");
          const parametros = new URLSearchParams({
            subido: "1",
            archivo: archivoSeleccionado.name,
          });
          window.location.href = `/lista.html?${parametros.toString()}`;
        } catch (error) {
          mostrarEstado(error.message || "No se pudo subir el archivo.", "error");
          boton.disabled = false;
        }
      });

      async function leerJson(respuesta) {
        const tipo = respuesta.headers.get("content-type") || "";
        if (!tipo.includes("application/json")) {
          throw new Error("El servidor no devolvió una respuesta JSON válida.");
        }
        return respuesta.json();
      }

      function mostrarEstado(mensaje, tipo) {
        estado.textContent = mensaje;
        estado.className = tipo;
      }
    </script>
  </body>
</html>
